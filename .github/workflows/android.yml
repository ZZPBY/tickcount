name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # AGP only downloads a missing SDK platform once the licence hash is on
      # disk, so make sure it is there before the build runs.
      - name: Accept Android SDK licences
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    env:
      # Empty when the repository has no signing secrets. Surfaced through `env`
      # because the `secrets` context is not available in a step-level `if`.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Restores the release keystore so every release is signed with the same
      # certificate — which is what lets an installed copy upgrade in place.
      # Skipped, with a warning below, when the secrets are absent.
      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Report signing key
        run: |
          if [ -f keystore.properties ]; then
            echo "Signing with the release keystore from repository secrets."
          else
            echo "::warning::No KEYSTORE_BASE64 secret is configured. This APK will be signed with the Android debug key and cannot upgrade an install signed with the release key."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Show APK signer
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: tickcount-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Idempotent, so re-running a workflow replaces the asset instead of
      # failing on a release that already exists. Ends by asserting the asset is
      # actually attached: a release that silently ends up with no APK is worse
      # than a red build.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          ls -l "$apk"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; replacing its APK."
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            echo "Creating release $GITHUB_REF_NAME."
            gh release create "$GITHUB_REF_NAME" "$apk" --generate-notes
          fi

          gh release view "$GITHUB_REF_NAME" --json tagName,assets \
            --jq '{tag: .tagName, assets: [.assets[].name]}'
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
            | grep -q '\.apk$'
