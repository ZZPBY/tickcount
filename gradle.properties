# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by Jetpack Compose.
android.useAndroidX=true

# Generate per-library R classes instead of one merged R class.
android.nonTransitiveRClass=true

# Official Kotlin code style.
kotlin.code.style=official

# Keep the build non-interactive and reproducible.
org.gradle.warning.mode=summary
